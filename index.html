<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የሰርግ ግብዣ | Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&family=Noto+Serif+Ethiopic:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. CSS STYLES (styles.css የነበረው)
           ========================================================================== */
        :root {
            --bg-color: #fffdf9;
            --text-color: #2c2520;
            --primary-color: #8a1c14; /* ደማቅ ቀይ የጥበብ ቀለም */
            --secondary-color: #115740; /* አረንጓዴ */
            --accent-color: #d4af37; /* ወርቃማ */
            --card-bg: #ffffff;
            --shadow: rgba(138, 28, 20, 0.1);
        }

        /* ለሊት (Dark Mode) ማስተካከያ */
        [data-theme="dark"] {
            --bg-color: #1a1613;
            --text-color: #f5f0eb;
            --primary-color: #e5b842;
            --secondary-color: #a3d1bd;
            --card-bg: #26201b;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif Ethiopic', 'Playfair Display', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.5s, color 0.5s;
        }

        /* ሲኒማቲክ መግቢያ (Intro Section) */
        .cinematic-intro {
            position: relative;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slideshow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(45%);
        }

        .slide.active { opacity: 1; }

        .intro-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #ffffff;
            padding: 0 20px;
        }

        .couple-names {
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-family: 'Playfair Display', serif;
        }
        
        .ampersand {
            display: block;
            font-size: 2rem;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .intro-date {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .enter-btn {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .enter-btn:hover { 
            transform: scale(1.05); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* ዋናው መረጃ ክፍል */
        .hidden { display: none !important; }

        .main-invitation {
            max-width: 650px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-color);
        }

        /* ገጽታ መቀያየሪያ (Theme Switch) */
        .theme-toggle { text-align: right; margin-bottom: 20px; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box;}
